name: Reckless

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "UCI version/date (e.g. 20260909)"
        required: true
        default: "20260909"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ARM64 Android target
        run: |
          rustup target add aarch64-linux-android

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Create clang and ar wrappers for Android target
        run: |
          mkdir -p $HOME/ndk-wrapper
          cat > $HOME/ndk-wrapper/clang << 'EOF'
          #!/bin/bash
          exec "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" "$@"
          EOF
          cat > $HOME/ndk-wrapper/aarch64-linux-android-ar << 'EOF'
          #!/bin/bash
          exec "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" "$@"
          EOF
          chmod +x $HOME/ndk-wrapper/clang $HOME/ndk-wrapper/aarch64-linux-android-ar
          echo "$HOME/ndk-wrapper" >> $GITHUB_PATH

      - name: Set UCI Version
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["UCI_DATE"]
          path = Path("build/build.rs")

          text = path.read_text()

          old = '''fn generate_engine_version() {
              let version = env!("CARGO_PKG_VERSION");

              let git_sha = Command::new("git")
                  .args(["rev-parse", "--short=8", "HEAD"])
                  .output()
                  .ok()
                  .filter(|v| v.status.success())
                  .and_then(|v| String::from_utf8(v.stdout).ok())
                  .map(|v| v.trim().to_string());

              if let Some(sha) = git_sha {
                  println!("cargo:rustc-env=ENGINE_VERSION={version}-{sha}")
              } else {
                  println!("cargo:rustc-env=ENGINE_VERSION={version}")
              }
          }'''

          new = f'''fn generate_engine_version() {{
              let version = "{version}";
              println!("cargo:rustc-env=ENGINE_VERSION={{version}}");
          }}'''

          if old not in text:
              raise SystemExit(
                  "Could not find the expected generate_engine_version() function."
              )

          path.write_text(text.replace(old, new, 1))

          print(f"Set Reckless UCI version to: {version}")
          PY

      - name: Build
        env:
          RUSTFLAGS: "-C target-feature=+neon,+dotprod"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: /home/runner/work/Reckless/Reckless/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang
        run: |
          which clang
          which aarch64-linux-android-ar
          cargo rustc --release --target aarch64-linux-android --bin reckless -- --emit link=reckless

      - name: List build output
        run: |
          find . -maxdepth 1 -type f -executable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reckless-android-arm64
          path: reckless

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Reckless Build ${{ github.run_number }}
          prerelease: true
          files: reckless
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
