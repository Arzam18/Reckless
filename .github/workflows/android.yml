name: Reckless Android ARM64

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: "UCI version/date (YYYYMMDD)"
        required: true
        default: "20261127"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UCI_DATE: ${{ inputs.uci_date }}
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate UCI date
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from datetime import datetime

          value = os.environ["UCI_DATE"]
          if not re.fullmatch(r"[0-9]{8}", value):
              raise SystemExit("uci_date must use YYYYMMDD format")
          try:
              datetime.strptime(value, "%Y%m%d")
          except ValueError as error:
              raise SystemExit(f"Invalid uci_date: {error}")
          print(f"Using UCI version: {value}")
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          NDK="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Set UCI version to selected date
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          date = os.environ["UCI_DATE"]
          path = Path("build/build.rs")
          source = path.read_text()
          marker = "fn generate_engine_version() {"

          if source.count(marker) != 1:
              raise SystemExit("Could not uniquely locate generate_engine_version() in build/build.rs")

          start = source.index(marker)
          replacement = (
              "fn generate_engine_version() {\n"
              f'    let version = "{date}";\n'
              '    println!("cargo:rustc-env=ENGINE_VERSION={version}");\n'
              "}\n"
          )
          path.write_text(source[:start] + replacement)
          print(f"Set UCI engine version to Reckless {date}")
          PY

      - name: Build Android ARM64 NEON binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          export CARGO_TARGET_DIR="$RUNNER_TEMP/reckless-target-neon"
          # RUSTFLAGS applies to the engine library as well as the UCI binary.
          # The NNUE SIMD implementation is compiled into the library crate.
          export RUSTFLAGS="-C target-feature=+neon,-dotprod"
          cargo build --locked --release --target aarch64-linux-android --bin reckless --no-default-features
          cp "$CARGO_TARGET_DIR/aarch64-linux-android/release/reckless" \
            "dist/reckless-android-arm64-neon-${UCI_DATE}"

      - name: Build Android ARM64 DotProd binary (I8MM disabled)
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/reckless-target-dotprod"
          # Apply DotProd to every target crate, including the Reckless library.
          # I8MM remains explicitly disabled.
          export RUSTFLAGS="-C target-feature=+neon,+dotprod,-i8mm"
          cargo build --locked --release --target aarch64-linux-android --bin reckless --no-default-features
          cp "$CARGO_TARGET_DIR/aarch64-linux-android/release/reckless" \
            "dist/reckless-android-arm64-dotprod-${UCI_DATE}"

      - name: Verify architecture, UCI version stamp, and SIMD instructions
        shell: bash
        run: |
          set -euo pipefail
          LLVM_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          READELF="$LLVM_BIN/llvm-readelf"
          OBJDUMP="$LLVM_BIN/llvm-objdump"
          NEON="dist/reckless-android-arm64-neon-${UCI_DATE}"
          DOTPROD="dist/reckless-android-arm64-dotprod-${UCI_DATE}"

          command -v strings >/dev/null
          for binary in "$NEON" "$DOTPROD"; do
            test -s "$binary"
            "$READELF" -h "$binary" | grep -q 'Machine:.*AArch64'
            # Cross-compiled Android ARM64 binaries cannot run on the x86_64
            # GitHub-hosted Linux runner. Check the embedded compile-time
            # ENGINE_VERSION string instead of executing the target binary.
            if ! strings -a "$binary" | grep -Fq "$UCI_DATE"; then
              echo "ERROR: UCI date $UCI_DATE was not found in $binary" >&2
              exit 1
            fi
          done

          # Tell LLVM to decode both DotProd and I8MM mnemonics so the checks
          # can reliably detect SDOT and reject I8MM instructions.
          "$OBJDUMP" --mattr=+dotprod,+i8mm -d "$NEON" > "$RUNNER_TEMP/reckless-neon.disasm"
          "$OBJDUMP" --mattr=+dotprod,+i8mm -d "$DOTPROD" > "$RUNNER_TEMP/reckless-dotprod.disasm"

          if grep -Eiq '\bsdot\b' "$RUNNER_TEMP/reckless-neon.disasm"; then
            echo "ERROR: NEON binary unexpectedly contains a DotProd instruction" >&2
            exit 1
          fi
          if ! grep -Eiq '\bsdot\b' "$RUNNER_TEMP/reckless-dotprod.disasm"; then
            echo "ERROR: DotProd binary does not contain the expected SDOT instruction" >&2
            exit 1
          fi
          if grep -Eiq '\b(usdot|sudot|smmla|ummla|usmmla)\b' "$RUNNER_TEMP/reckless-dotprod.disasm"; then
            echo "ERROR: DotProd binary unexpectedly contains an I8MM instruction" >&2
            exit 1
          fi

          echo "Verified AArch64 NEON and DotProd binaries; I8MM instructions are absent."
          sha256sum "$NEON" "$DOTPROD"

      - name: Upload NEON artifact
        uses: actions/upload-artifact@v4
        with:
          name: reckless-android-arm64-neon-${{ inputs.uci_date }}
          path: dist/reckless-android-arm64-neon-${{ inputs.uci_date }}
          if-no-files-found: error

      - name: Upload DotProd artifact
        uses: actions/upload-artifact@v4
        with:
          name: reckless-android-arm64-dotprod-${{ inputs.uci_date }}
          path: dist/reckless-android-arm64-dotprod-${{ inputs.uci_date }}
          if-no-files-found: error

      - name: Publish Android prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ inputs.uci_date }}-${{ github.run_number }}
          name: Reckless Android ${{ inputs.uci_date }}
          prerelease: true
          files: |
            dist/reckless-android-arm64-neon-${{ inputs.uci_date }}
            dist/reckless-android-arm64-dotprod-${{ inputs.uci_date }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
